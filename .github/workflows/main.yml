name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: saas_test
          JWT_SECRET: test_secret
          JWT_EXPIRY: 7d
          STRIPE_SECRET_KEY: test_key
          STRIPE_PUBLISHABLE_KEY: test_key
          STRIPE_FREE_PRICE_ID: test_id
          STRIPE_PRO_PRICE_ID: test_id
          STRIPE_ENTERPRISE_PRICE_ID: test_id
          STRIPE_WEBHOOK_SECRET: test_secret
        run: node -e "const { AppDataSource } = require('./dist/database/data-source'); AppDataSource.initialize().then(() => { AppDataSource.runMigrations().then((m) => { console.log('Migrations done:', m.length); process.exit(0); }); }).catch(e => { console.error(e.message); process.exit(1); });"

      - name: Build Docker image
        run: docker build -t saas-app .